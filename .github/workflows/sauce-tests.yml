name: Sauce Labs Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Credentials live only in GitHub repo Secrets (Settings > Secrets and variables > Actions).
      # Do not commit SAUCE_USERNAME or SAUCE_ACCESS_KEY in the repository.
      - name: Install saucectl
        uses: saucelabs/saucectl-run-action@v4
        with:
          sauce-username: ${{ secrets.SAUCE_USERNAME }}
          sauce-access-key: ${{ secrets.SAUCE_ACCESS_KEY }}
          config-file: .sauce/config.yml
